openapi: 3.1.1
info:
  title: Atlas Wallet and Financial Operations API
  version: 2026-07-23
  summary: Security-first contracts for wallet, transfers, merchant payments, operations, and reporting.
  description: |
    Reference contract for the Atlas portfolio platform. Financial amounts are integer minor-unit
    strings. Money-moving commands are idempotent. Browser applications use a backend-for-frontend
    session; merchant and service integrations use scoped machine credentials. This file is a
    deliberately curated baseline, not an automatically inferred description of handlers.
  contact:
    name: Atlas API Governance
  license:
    name: Portfolio reference - no production authorization
servers:
  - url: https://api.staging.atlas.example
    description: Synthetic staging environment
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Platform
  - name: Identity
  - name: Organizations
  - name: API credentials
  - name: Approvals
  - name: Wallets
  - name: Beneficiaries
  - name: Transfers
  - name: Merchant payments
  - name: Webhooks
  - name: Settlement
  - name: Operations
  - name: Reporting
security:
  - bffSession: []
paths:
  /health/live:
    get:
      operationId: getLiveness
      tags: [Platform]
      summary: Report process liveness only
      description: Returns process liveness without checking or disclosing dependency topology.
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: API process is alive
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
            traceparent: {$ref: '#/components/headers/Traceparent'}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Liveness'}
              example: {status: alive}
        '400': {$ref: '#/components/responses/RequestMalformed'}
        '413': {$ref: '#/components/responses/RequestTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}

  /health/ready:
    get:
      operationId: getReadiness
      tags: [Platform]
      summary: Report safe dependency and migration readiness
      description: Fails closed when required dependencies or migration state cannot be verified; never returns topology or migration detail.
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Required dependency and migration checks are ready
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
            traceparent: {$ref: '#/components/headers/Traceparent'}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Readiness'}
              example: {status: ready}
        '400': {$ref: '#/components/responses/RequestMalformed'}
        '413': {$ref: '#/components/responses/RequestTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /version:
    get:
      operationId: getVersion
      tags: [Platform]
      summary: Report safe build and contract identity
      description: Returns only source revision, canonical contract version, and UTC build time.
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Safe build identity
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            X-Correlation-Id: {$ref: '#/components/headers/XCorrelationId'}
            traceparent: {$ref: '#/components/headers/Traceparent'}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VersionInfo'}
              example:
                source_revision: 710bca0a3c5dd44fb009512e2200a65b5da59dcd
                contract_version: 2026-07-20
                build_time: '2026-07-20T00:00:00Z'
        '400': {$ref: '#/components/responses/RequestMalformed'}
        '413': {$ref: '#/components/responses/RequestTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}

  /v1/me:
    get:
      operationId: getCurrentPrincipal
      tags: [Identity]
      summary: Get the authenticated principal and active tenant context
      security:
        - bffSession: []
        - merchantApiKey: []
      responses:
        '200':
          description: Current principal
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            X-Atlas-CSRF-Token: {$ref: '#/components/headers/XAtlasCSRFToken'}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Principal'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /v1/auth/login:
    get:
      operationId: beginBrowserLogin
      tags: [Identity]
      summary: Begin a synthetic OIDC authorization-code login
      description: Creates a short-lived single-use login transaction and redirects only to an allow-listed issuer.
      security: []
      parameters:
        - $ref: '#/components/parameters/AuthPopulation'
        - $ref: '#/components/parameters/ReturnTo'
      responses:
        '303':
          description: Redirect to the allow-listed synthetic identity provider
          headers:
            Location: {$ref: '#/components/headers/Location'}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
        '400': {$ref: '#/components/responses/RequestMalformed'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /v1/auth/callback:
    get:
      operationId: completeBrowserLogin
      tags: [Identity]
      summary: Complete a synthetic OIDC authorization-code login
      description: Validates issuer, state, nonce, PKCE, code redemption, and claim mapping before issuing an opaque BFF session.
      security: []
      parameters:
        - $ref: '#/components/parameters/AuthorizationCode'
        - $ref: '#/components/parameters/OIDCState'
        - $ref: '#/components/parameters/OIDCAuthorizationIssuer'
        - $ref: '#/components/parameters/OIDCSessionState'
      responses:
        '303':
          description: Redirect to a same-origin allow-listed application path
          headers:
            Location: {$ref: '#/components/headers/Location'}
            Set-Cookie: {$ref: '#/components/headers/SessionSetCookie'}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
        '400': {$ref: '#/components/responses/RequestMalformed'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /v1/logout:
    post:
      operationId: logoutCurrentSession
      tags: [Identity]
      summary: Revoke the current browser session
      parameters:
        - $ref: '#/components/parameters/XAtlasCSRFToken'
      responses:
        '204':
          description: Current session revoked or already absent
          headers:
            Set-Cookie: {$ref: '#/components/headers/SessionSetCookie'}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /v1/sessions:
    get:
      operationId: listPrincipalSessions
      tags: [Identity]
      summary: List sessions owned by the current principal
      responses:
        '200':
          description: Current principal session list
          headers:
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: array
                    maxItems: 100
                    items: {$ref: '#/components/schemas/Session'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}

  /v1/sessions/{session_id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    delete:
      operationId: revokePrincipalSession
      tags: [Identity]
      summary: Revoke one session owned by the current principal
      parameters:
        - $ref: '#/components/parameters/XAtlasCSRFToken'
      responses:
        '204': {description: Session revoked or already absent}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrConcealed'}

  /v1/sessions/revoke-all:
    post:
      operationId: revokeAllPrincipalSessions
      tags: [Identity]
      summary: Revoke all sessions for the current principal
      parameters:
        - $ref: '#/components/parameters/XAtlasCSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RevokeAllSessionsRequest'}
      responses:
        '204': {description: Selected sessions revoked}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}

  /v1/step-up/challenges:
    post:
      operationId: createStepUpChallenge
      tags: [Identity]
      summary: Begin a fresh higher-assurance authentication challenge
      parameters:
        - $ref: '#/components/parameters/XAtlasCSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StepUpChallengeRequest'}
      responses:
        '201':
          description: Step-up challenge created
          headers:
            Location: {$ref: '#/components/headers/Location'}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StepUpChallenge'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /v1/me/active-organization:
    put:
      operationId: setActiveOrganization
      tags: [Organizations]
      summary: Select the current browser session organization context
      parameters:
        - $ref: '#/components/parameters/XAtlasCSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetActiveOrganizationRequest'}
      responses:
        '200':
          description: Updated principal and tenant context
          headers:
            X-Authorization-Decision-Id: {$ref: '#/components/headers/XAuthorizationDecisionId'}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Principal'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrConcealed'}

  /v1/organizations:
    get:
      operationId: listPrincipalOrganizations
      tags: [Organizations]
      summary: List organizations visible to the current principal
      responses:
        '200':
          description: Organization list
          headers:
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: array
                    maxItems: 100
                    items: {$ref: '#/components/schemas/Organization'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}

  /v1/organizations/{organization_id}/members:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      operationId: listOrganizationMembers
      tags: [Organizations]
      summary: List authorized members without exposing concealed membership
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Authorized organization-member page
          headers:
            X-Authorization-Decision-Id: {$ref: '#/components/headers/XAuthorizationDecisionId'}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, page]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/OrganizationMember'}
                  page: {$ref: '#/components/schemas/PageInfo'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrConcealed'}

  /v1/organizations/{organization_id}/invitations:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      operationId: createOrganizationInvitation
      tags: [Organizations]
      summary: Create a single-use organization invitation
      parameters:
        - $ref: '#/components/parameters/XAtlasCSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateOrganizationInvitationRequest'}
      responses:
        '201':
          description: Invitation created; the acceptance token is disclosed only for the original response
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
            Location: {$ref: '#/components/headers/Location'}
            X-Authorization-Decision-Id: {$ref: '#/components/headers/XAuthorizationDecisionId'}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrganizationInvitationCreated'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrConcealed'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/organization-invitations/{invitation_id}/acceptance:
    parameters:
      - $ref: '#/components/parameters/InvitationId'
    post:
      operationId: acceptOrganizationInvitation
      tags: [Organizations]
      summary: Accept a single-use organization invitation
      parameters:
        - $ref: '#/components/parameters/XAtlasCSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AcceptOrganizationInvitationRequest'}
      responses:
        '200':
          description: Invitation accepted and membership returned
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrganizationMember'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrConcealed'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /v1/organizations/{organization_id}/members/{member_id}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/MemberId'
    patch:
      operationId: updateOrganizationMember
      tags: [Organizations]
      summary: Change an organization member role subject to approval policy
      parameters:
        - $ref: '#/components/parameters/XAtlasCSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateOrganizationMemberRequest'}
      responses:
        '200':
          description: Membership changed
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
            X-Authorization-Decision-Id: {$ref: '#/components/headers/XAuthorizationDecisionId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrganizationMember'}
        '202':
          description: Approval is required before execution
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Approval'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/StepUpRequired'}
        '404': {$ref: '#/components/responses/NotFoundOrConcealed'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    delete:
      operationId: revokeOrganizationMember
      tags: [Organizations]
      summary: Revoke organization membership subject to last-admin policy
      parameters:
        - $ref: '#/components/parameters/XAtlasCSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204': {description: Membership revoked}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/StepUpRequired'}
        '404': {$ref: '#/components/responses/NotFoundOrConcealed'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}

  /v1/api-credentials:
    get:
      operationId: listAPICredentials
      tags: [API credentials]
      summary: List masked API-credential metadata for the active organization
      responses:
        '200':
          description: API-credential metadata list
          headers:
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: array
                    maxItems: 100
                    items: {$ref: '#/components/schemas/APICredential'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createAPICredential
      tags: [API credentials]
      summary: Create an organization API credential with least-privilege scopes
      parameters:
        - $ref: '#/components/parameters/XAtlasCSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAPICredentialRequest'}
      responses:
        '201':
          description: API credential created; the secret is disclosed only for the original response
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
            Location: {$ref: '#/components/headers/Location'}
            X-Authorization-Decision-Id: {$ref: '#/components/headers/XAuthorizationDecisionId'}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/APICredentialCreated'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/StepUpRequired'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/api-credentials/{credential_id}/rotate:
    parameters:
      - $ref: '#/components/parameters/APICredentialId'
    post:
      operationId: rotateAPICredential
      tags: [API credentials]
      summary: Rotate an API credential with a bounded overlap window
      parameters:
        - $ref: '#/components/parameters/XAtlasCSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Replacement credential created; the new secret is disclosed only for the original response
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
            X-Authorization-Decision-Id: {$ref: '#/components/headers/XAuthorizationDecisionId'}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/APICredentialCreated'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/StepUpRequired'}
        '404': {$ref: '#/components/responses/NotFoundOrConcealed'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/api-credentials/{credential_id}:
    parameters:
      - $ref: '#/components/parameters/APICredentialId'
    delete:
      operationId: revokeAPICredential
      tags: [API credentials]
      summary: Immediately revoke an API credential
      parameters:
        - $ref: '#/components/parameters/XAtlasCSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': {description: API credential revoked or already absent}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/StepUpRequired'}
        '404': {$ref: '#/components/responses/NotFoundOrConcealed'}
        '409': {$ref: '#/components/responses/Conflict'}

  /v1/approvals:
    get:
      operationId: listApprovals
      tags: [Approvals]
      summary: List approvals visible to the active tenant and principal
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Approval page
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, page]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Approval'}
                  page: {$ref: '#/components/schemas/PageInfo'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createApproval
      tags: [Approvals]
      summary: Create a typed approval request over a canonical payload digest
      parameters:
        - $ref: '#/components/parameters/XAtlasCSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateApprovalRequest'}
      responses:
        '201':
          description: Approval request created
          headers:
            Location: {$ref: '#/components/headers/Location'}
            X-Authorization-Decision-Id: {$ref: '#/components/headers/XAuthorizationDecisionId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Approval'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/StepUpRequired'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /v1/approvals/{approval_id}:
    parameters:
      - $ref: '#/components/parameters/ApprovalId'
    get:
      operationId: getApproval
      tags: [Approvals]
      summary: Get an approval and its immutable payload digest
      responses:
        '200':
          description: Approval detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Approval'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrConcealed'}

  /v1/approvals/{approval_id}/decisions:
    parameters:
      - $ref: '#/components/parameters/ApprovalId'
    post:
      operationId: decideApproval
      tags: [Approvals]
      summary: Approve or reject an approval as a distinct principal
      parameters:
        - $ref: '#/components/parameters/XAtlasCSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApprovalDecisionRequest'}
      responses:
        '200':
          description: Approval decision recorded
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
            X-Authorization-Decision-Id: {$ref: '#/components/headers/XAuthorizationDecisionId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Approval'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/StepUpRequired'}
        '404': {$ref: '#/components/responses/NotFoundOrConcealed'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}

  /v1/approvals/{approval_id}/executions:
    parameters:
      - $ref: '#/components/parameters/ApprovalId'
    post:
      operationId: executeApproval
      tags: [Approvals]
      summary: Execute an approved typed action after payload revalidation
      parameters:
        - $ref: '#/components/parameters/XAtlasCSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Approved action executed
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
